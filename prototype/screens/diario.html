  <style>

    /* ── Layout ── */
    .timeline-screen {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(54px + env(safe-area-inset-bottom, 0px) + 16px);
    }

    /* ── Top bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      gap: var(--s-3);
      padding: var(--s-4) var(--s-4) var(--s-3);
    }

    /* ── Week block ── */
    .week-block {
      margin: 0 0 var(--s-2);
      border-top: 1px solid var(--c-aco-700);
    }

    .week-header {
      display: flex;
      align-items: center;
      gap: var(--s-3);
      padding: var(--s-3) var(--s-4) var(--s-2);
      flex-wrap: wrap;
    }
    .week-label {
      font-family: var(--f-narrow);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--c-cinza-400);
      flex: 1;
      white-space: nowrap;
    }
    .week-bf-badge {
      font-family: var(--f-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--c-giz-100);
      background: var(--c-aco-700);
      border: 1px solid var(--c-linha-500);
      border-radius: var(--r-1);
      padding: 2px 7px;
      white-space: nowrap;
    }
    .week-adherence {
      font-family: var(--f-mono);
      font-size: 10px;
      color: var(--c-cinza-400);
      white-space: nowrap;
    }
    .week-adherence.good { color: #7bc47a; }
    .week-adherence.warn { color: var(--c-alerta); }

    /* ── Event list ── */
    .event-list {
      border-top: 1px solid var(--c-aco-700);
      display: flex;
      flex-direction: column;
    }

    .event-row {
      display: flex;
      align-items: center;
      gap: var(--s-3);
      padding: var(--s-3) var(--s-4);
      border-bottom: 1px solid var(--c-aco-800);
      text-decoration: none;
      cursor: pointer;
      transition: background var(--t-fast);
    }
    .event-row:last-child { border-bottom: none; }
    .event-row:hover { background: rgba(255,255,255,0.025); }

    .event-icon {
      font-size: 14px;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }
    .event-icon.measurement { color: var(--c-arco); }
    .event-icon.reajuste    { color: var(--c-alerta); }
    .event-icon.pattern     { color: var(--c-cinza-300); }

    .event-body { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .event-type-label {
      font-family: var(--f-narrow);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--c-cinza-400);
    }
    .event-title {
      font-family: var(--f-display);
      font-size: 13px;
      font-weight: 600;
      color: var(--c-giz-100);
      line-height: 1.3;
    }
    .event-meta {
      font-family: var(--f-mono);
      font-size: 10px;
      color: var(--c-cinza-300);
      font-variant-numeric: tabular-nums;
    }
    .event-arrow {
      font-size: 14px;
      color: var(--c-cinza-400);
      flex-shrink: 0;
    }

    /* ── Days list ── */
    .days-list {
      border-top: 1px solid var(--c-aco-700);
    }

    .day-row-wrap { border-bottom: 1px solid var(--c-aco-800); }
    .day-row-wrap:last-child { border-bottom: none; }

    .day-row-header {
      display: flex;
      align-items: center;
      gap: var(--s-3);
      padding: 9px var(--s-4);
      cursor: pointer;
      transition: background var(--t-fast);
      user-select: none;
    }
    .day-row-header:hover { background: rgba(255,255,255,0.02); }
    .day-row-header.no-data { opacity: 0.38; cursor: default; }
    .day-row-header.no-data:hover { background: none; }

    .day-arrow {
      font-family: var(--f-mono);
      font-size: 10px;
      color: var(--c-cinza-400);
      width: 10px;
      flex-shrink: 0;
    }
    .day-date {
      font-family: var(--f-mono);
      font-size: 11px;
      color: var(--c-cinza-300);
      flex: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }
    .day-kcal {
      font-family: var(--f-mono);
      font-size: 11px;
      color: var(--c-cinza-300);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .day-kcal.over { color: var(--c-arco); }
    .day-kcal.none { color: var(--c-cinza-400); }

    /* Adherence dot */
    .adh-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .adh-dot.on      { background: #7bc47a; }
    .adh-dot.over    { background: var(--c-arco); }
    .adh-dot.partial { background: var(--c-cinza-400); border: 1px solid var(--c-cinza-300); }
    .adh-dot.none    { background: none; border: 1px solid var(--c-aco-700); }

    /* Expanded meals */
    .day-meals {
      display: none;
      flex-direction: column;
      background: var(--c-aco-800);
      padding: var(--s-2) var(--s-4) var(--s-3) calc(var(--s-4) + 22px);
      gap: 1px;
    }
    .day-meals.open { display: flex; }
    .meal-entry {
      display: flex;
      align-items: baseline;
      gap: var(--s-3);
      padding: 5px 0;
      border-bottom: 1px solid var(--c-aco-700);
      text-decoration: none;
    }
    .meal-entry:last-child { border-bottom: none; }
    .meal-slot {
      font-family: var(--f-narrow);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--c-cinza-300);
      white-space: nowrap;
    }
    .meal-items {
      font-family: var(--f-narrow);
      font-size: 10px;
      color: var(--c-cinza-400);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meal-kcal {
      font-family: var(--f-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--c-giz-200);
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* ── Empty state ── */
    .empty-week {
      padding: var(--s-3) var(--s-4);
      font-family: var(--f-narrow);
      font-size: 10px;
      color: var(--c-cinza-400);
      font-style: italic;
    }
  </style>
</head>

  /* ── SEMANA 1 · 21–27 ABR (início) ── */
  {
    weekNum: 1,
    label: 'INÍCIO · SEMANA 1',
    dates: '21–27 ABR',
    bf: { value: 28.8, delta: null },
    adherence: { days: 4, total: 7 },
    events: [
      {
        type: 'measurement',
        date: '24 ABR',
        histIdx: 0,
        title: '28.8% gordura corporal',
        meta: 'Medição inicial · Cintura 96 cm',
      },
    ],
    days: [
      { label: 'SEG 21 ABR', kcal: 0,    target: 2200, status: 'none', meals: [] },
      { label: 'TER 22 ABR', kcal: 0,    target: 2200, status: 'none', meals: [] },
      { label: 'QUA 23 ABR', kcal: 0,    target: 2200, status: 'none', meals: [] },
      { label: 'QUI 24 ABR', kcal: 2050, target: 2200, status: 'on',   meals: [] },
      { label: 'SEX 25 ABR', kcal: 2180, target: 2200, status: 'on',   meals: [] },
      { label: 'SÁB 26 ABR', kcal: 2310, target: 2200, status: 'over', meals: [] },
      { label: 'DOM 27 ABR', kcal: 2140, target: 2200, status: 'on',   meals: [] },
    ],
  },
];

/* ──────────────────────────────────────────
   RENDER ENGINE
   ────────────────────────────────────────── */
const EVENT_ICONS = {
  measurement: { char: '◉', cls: 'measurement', typeLabel: 'MEDIÇÃO' },
  reajuste:    { char: '⚡', cls: 'reajuste',    typeLabel: 'REAJUSTE' },
  pattern:     { char: '◈', cls: 'pattern',      typeLabel: 'PADRÃO DETECTADO' },
};

function adherenceClass(adherence) {
  const pct = adherence.days / adherence.total;
  if (pct >= 0.85) return 'good';
  if (pct >= 0.57) return '';
  return 'warn';
}

function renderEvent(ev) {
  const icon = EVENT_ICONS[ev.type];
  let href = '#';
  if (ev.type === 'measurement') href = 'measurement-detail.html?i=' + ev.histIdx;
  else if (ev.href) href = ev.href;

  const el = document.createElement('a');
  el.className = 'event-row';
  el.href = href;
  el.innerHTML =
    '<span class="event-icon ' + icon.cls + '">' + icon.char + '</span>' +
    '<div class="event-body">' +
      '<span class="event-type-label">' + icon.typeLabel + ' · ' + ev.date + '</span>' +
      '<span class="event-title">' + ev.title + '</span>' +
      (ev.meta ? '<span class="event-meta">' + ev.meta + '</span>' : '') +
    '</div>' +
    '<span class="event-arrow">→</span>';
  return el;
}

function dotClass(status) {
  return { on: 'on', over: 'over', partial: 'partial', none: 'none' }[status] || 'none';
}

function renderDay(day) {
  const wrap = document.createElement('div');
  wrap.className = 'day-row-wrap';

  const hasMeals  = day.meals && day.meals.length > 0;
  const hasKcal   = day.status !== 'none';
  const canExpand = hasMeals;

  /* header row */
  const header = document.createElement('div');
  header.className = 'day-row-header' + (day.status === 'none' ? ' no-data' : '');
  if (canExpand) {
    header.onclick = function() { toggleDay(this); };
  }

  const kcalStr = hasKcal
    ? day.kcal.toLocaleString('pt-BR') + '/' + day.target.toLocaleString('pt-BR') + ' kcal'
    : 'sem registro';

  header.innerHTML =
    '<span class="day-arrow">' + (canExpand ? '▸' : '–') + '</span>' +
    '<span class="day-date">' + day.label + '</span>' +
    '<span class="day-kcal ' + (day.status === 'over' ? 'over' : (day.status === 'none' ? 'none' : '')) + '">' + kcalStr + '</span>' +
    '<span class="adh-dot ' + dotClass(day.status) + '"></span>';
  wrap.appendChild(header);

  /* expandable meals */
  if (hasMeals) {
    const mealsEl = document.createElement('div');
    mealsEl.className = 'day-meals';
    day.meals.forEach(function(meal) {
      const entry = document.createElement('a');
      entry.className = 'meal-entry';
      entry.href = '#';
      entry.innerHTML =
        '<span class="meal-slot">' + meal.slot + ' · ' + meal.time + '</span>' +
        '<span class="meal-items">' + meal.items + '</span>' +
        '<span class="meal-kcal">' + meal.kcal + ' kcal</span>';
      mealsEl.appendChild(entry);
    });
    wrap.appendChild(mealsEl);
  }

  return wrap;
}

function toggleDay(headerEl) {
  const wrap  = headerEl.parentElement;
  const meals = wrap.querySelector('.day-meals');
  const arrow = headerEl.querySelector('.day-arrow');
  if (!meals) return;
  const open = meals.classList.toggle('open');
  arrow.textContent = open ? '▾' : '▸';
}

function renderWeek(week) {
  const block = document.createElement('div');
  block.className = 'week-block';

  /* week header */
  const adhText = week.adherence.days + '/' + week.adherence.total + ' DIAS';
  const header = document.createElement('div');
  header.className = 'week-header';
  header.innerHTML =
    '<span class="week-label">' + week.label + ' · ' + week.dates + '</span>' +
    (week.bf ? '<span class="week-bf-badge">' + week.bf.value.toFixed(1) + '% BF</span>' : '') +
    '<span class="week-adherence ' + adherenceClass(week.adherence) + '">' + adhText + '</span>';
  block.appendChild(header);

  /* events */
  if (week.events && week.events.length > 0) {
    const eventList = document.createElement('div');
    eventList.className = 'event-list';
    week.events.forEach(function(ev) { eventList.appendChild(renderEvent(ev)); });
    block.appendChild(eventList);
  }

  /* days */
  const daysList = document.createElement('div');
  daysList.className = 'days-list';
  week.days.forEach(function(day) { daysList.appendChild(renderDay(day)); });
  block.appendChild(daysList);

  return block;
}

/* ── Main render ── */
const root = document.getElementById('timeline-root');
SEED_WEEKS.forEach(function(week) { root.appendChild(renderWeek(week)); });
</script>
