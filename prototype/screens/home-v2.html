<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#06070A" />
  <script src="../frame.js"></script>
  <title>NutriHero — Hoje · V2 Gauge</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../components.css" />
  <style>
    .home {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: var(--s-4);
      padding-bottom: calc(var(--s-6) + 72px);
    }

    /* ── Top row ── */
    .top {
      padding-top: var(--s-4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--s-6);
    }
    .date {
      font-family: var(--f-narrow);
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--c-cinza-300);
    }
    .streak {
      font-family: var(--f-mono);
      font-size: 11px;
      color: var(--c-giz-200);
      letter-spacing: 0.04em;
    }

    /* ── Gauge block ── */
    .gauge-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--s-3);
      margin-bottom: var(--s-2);
    }
    .gauge-eyebrow {
      font-family: var(--f-narrow);
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--c-cinza-300);
      align-self: flex-start;
    }
    .gauge-wrap {
      position: relative;
      width: 100%;
      max-width: 300px;
    }
    .gauge-svg {
      width: 100%;
      display: block;
    }

    /* Gauge arc animation
       Track: cinza-700 (#363A46) — legível no dark bg sem competir com o fill
       Fill: giz-100 (warm white) — arco clean/premium; orange fica reservado ao CTA
       Stroke 14px — presença sem grosseria
    */
    .gauge-track {
      fill: none;
      stroke: var(--c-cinza-700);
      stroke-width: 14;
      stroke-linecap: round;
    }
    .gauge-fill {
      fill: none;
      stroke: var(--c-giz-100);
      stroke-width: 14;
      stroke-linecap: round;
      /* dasharray = total semicircle (314.16);
         dashoffset start: 320 (> total → nada visível + sem artefato de linecap)
         dashoffset final: 56.55 (82% = 1640÷2000) */
      stroke-dasharray: 314.16;
      stroke-dashoffset: 320;
      animation: gauge-in 800ms cubic-bezier(0.2, 1, 0.2, 1) 0ms both;
    }
    @keyframes gauge-in {
      from { stroke-dashoffset: 320; }
      to   { stroke-dashoffset: 56.55; }
    }

    /* Pulso under gauge — curto, só assinatura */
    .pulso-wrap {
      width: 32%;
      margin: 0 auto var(--s-2);
    }

    /* Remaining stat */
    .remaining-row {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: var(--s-2);
      margin-bottom: var(--s-6);
    }
    .remaining-val {
      font-family: var(--f-mono);
      font-weight: 700;
      font-size: 15px;
      color: var(--c-giz-100);
      letter-spacing: -0.01em;
    }
    .remaining-label {
      font-family: var(--f-narrow);
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--c-cinza-300);
    }

    /* ── Deviation slot ── */
    #deviation-slot:empty { display: none; }
    #deviation-slot { margin-bottom: var(--s-4); }

    /* ── Dev row ── */
    .dev-row {
      margin-top: auto;
      padding-top: var(--s-6);
      display: flex;
      justify-content: flex-end;
    }
    .dev-btn {
      font-family: var(--f-narrow);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--c-cinza-400);
      background: none;
      border: 1px dashed var(--c-linha-500);
      padding: 4px 10px;
      border-radius: var(--r-1);
      cursor: pointer;
      transition: color var(--t-fast), border-color var(--t-fast);
    }
    .dev-btn:hover { color: var(--c-arco); border-color: var(--c-arco); }

    /* ── Sections ── */
    .section {
      border-top: 1px solid var(--c-linha-500);
      padding-top: var(--s-4);
      margin-top: var(--s-2);
      display: flex;
      flex-direction: column;
      gap: var(--s-3);
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .section-head .h {
      font-family: var(--f-narrow);
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--c-giz-200);
    }
    .section-head .meta {
      font-family: var(--f-mono);
      font-size: 11px;
      color: var(--c-cinza-300);
    }

    /* Next meal chip */
    .next-chip {
      display: flex;
      align-items: center;
      gap: var(--s-3);
      text-decoration: none;
      padding: var(--s-3) var(--s-4);
      background: var(--c-aco-700);
      border-radius: var(--r-2);
      border: 1px solid var(--c-linha-500);
      transition: border-color var(--t-fast);
    }
    .next-chip:hover { border-color: rgba(255,91,31,0.35); }
    .next-chip .nc-icon {
      width: 20px;
      height: 20px;
      color: var(--c-cinza-400);
      flex-shrink: 0;
    }
    .next-chip .nc-body { flex: 1; min-width: 0; }
    .next-chip .nc-name {
      font-family: var(--f-display);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--c-giz-100);
    }
    .next-chip .nc-meta {
      font-family: var(--f-mono);
      font-size: 11px;
      color: var(--c-cinza-300);
      margin-top: 2px;
    }
    .next-chip .nc-arrow {
      font-family: var(--f-mono);
      font-size: 14px;
      color: var(--c-cinza-400);
      flex-shrink: 0;
    }

    .meal-list {
      display: flex;
      flex-direction: column;
      gap: var(--s-1);
    }
  </style>
</head>
<body>
  <div class="home">

    <div class="top">
      <span class="date">TER · 19 MAI</span>
      <span class="streak">+4 DIAS NO PLANO</span>
    </div>

    <!-- Gauge hero -->
    <div class="gauge-block">
      <span class="gauge-eyebrow">CONSUMIDO HOJE</span>

      <div class="gauge-wrap">
        <!--
          viewBox 0 0 220 118 — center (110,110), radius 100
          Arc: M 10,110 A 100,100 0 0 1 210,110
          sweep=0 → counter-clockwise in SVG = upper semicircle ✓
          With viewBox cutting at y=118, the arch fills the entire SVG width
          leaving only 8px below the endpoints (buffer for round linecap).

          Arc length (π × 100): 314.16
          82% of 314.16 = 257.61 → dashoffset end = 314.16 − 257.61 = 56.55
        -->
        <svg class="gauge-svg" viewBox="0 0 220 118"
             role="img" aria-label="Consumido: 1.640 de 2.000 kcal (82%)">
          <!-- Track (background arc) -->
          <path class="gauge-track"
                d="M 10,110 A 100,100 0 0 1 210,110"/>
          <!-- Fill: 82% — animated from invisible to 82% -->
          <path class="gauge-fill"
                d="M 10,110 A 100,100 0 0 1 210,110"/>
          <!-- Text inside arch — positioned in the lower half of the arch interior -->
          <text x="110" y="76"
                text-anchor="middle"
                style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:30px;letter-spacing:-0.04em;fill:var(--c-giz-100);font-feature-settings:'tnum';">1.640</text>
          <text x="110" y="97"
                text-anchor="middle"
                style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.02em;fill:var(--c-cinza-300);">/ 2.000 kcal</text>
        </svg>
      </div>
    </div>

    <!-- Pulso line -->
    <div class="pulso-wrap">
      <div class="pulso-line"></div>
    </div>

    <!-- Remaining -->
    <div class="remaining-row">
      <span class="remaining-val">360 kcal</span>
      <span class="remaining-label">restam para fechar o dia</span>
    </div>

    <!-- Desvio: só aparece quando detectado -->
    <div id="deviation-slot"></div>

    <!-- Próxima refeição -->
    <div class="section">
      <span class="eyebrow">PRÓXIMA</span>
      <a href="meal-log.html?slot=almoco" class="next-chip">
        <svg class="nc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <div class="nc-body">
          <div class="nc-name">Almoço</div>
          <div class="nc-meta">12:30 &middot; 620 kcal estimados</div>
        </div>
        <span class="nc-arrow">→</span>
      </a>
    </div>

    <!-- Refeições registradas -->
    <div class="section">
      <div class="section-head">
        <span class="h">REGISTRADAS HOJE</span>
        <span class="meta">2 / 5</span>
      </div>
      <div class="meal-list">
        <a href="meal-detail.html?slot=cafe" class="meal-card done">
          <div class="meal-header">
            <span class="meal-name">Café · 07:15</span>
            <span class="meal-kcal">420 kcal</span>
          </div>
          <span class="meal-items">Ovos · pão integral · café preto</span>
        </a>
        <a href="meal-detail.html?slot=lanche-am" class="meal-card done">
          <div class="meal-header">
            <span class="meal-name">Lanche · 10:00</span>
            <span class="meal-kcal">400 kcal</span>
          </div>
          <span class="meal-items">Whey · banana · pasta de amendoim</span>
        </a>
      </div>
    </div>

    <!-- Dev -->
    <div class="dev-row">
      <button class="dev-btn" onclick="toggleDeviation()">Simular desvio</button>
    </div>

  </div><!-- /home -->

  <nav class="tab-bar">
    <a class="tab active" href="home.html" aria-label="Hoje">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></svg>
      <span class="tab-label">Hoje</span>
    </a>
    <a class="tab" href="bf-evolution.html" aria-label="Evolução">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 6"/><polyline points="15 6 21 6 21 12"/></svg>
      <span class="tab-label">Evolução</span>
    </a>
    <a class="tab-fab" href="meal-log.html" aria-label="Registrar refeição">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
        <circle cx="12" cy="13" r="3.5"/>
      </svg>
    </a>
    <a class="tab" href="diario.html" aria-label="Diário">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h12a2 2 0 0 1 2 2v14l-4-2-4 2-4-2-4 2V6a2 2 0 0 1 2-2z"/><path d="M8 9h8M8 13h6"/></svg>
      <span class="tab-label">Diário</span>
    </a>
    <a class="tab" href="perfil.html" aria-label="Perfil">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/></svg>
      <span class="tab-label">Perfil</span>
    </a>
  </nav>

  <script>
    function toggleDeviation() {
      const slot = document.getElementById('deviation-slot');
      const pulso = document.querySelector('.pulso-line');
      if (slot.innerHTML.trim()) {
        slot.innerHTML = '';
        pulso.classList.remove('off-plan');
        return;
      }
      pulso.classList.add('off-plan');
      slot.innerHTML = `
        <div class="attention-card">
          <span class="att-eyebrow">PLANO MUDOU</span>
          <span class="att-title">Almoço ficou 200 kcal acima.</span>
          <p class="att-body">Você saiu da zona. Reajuste as próximas refeições para fechar o dia no plano.</p>
          <div class="att-actions">
            <a href="reajust-ticker.html" class="cta-primary">Reajustar dieta</a>
          </div>
        </div>`;
      slot.querySelector('.attention-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  </script>
</body>
</html>
