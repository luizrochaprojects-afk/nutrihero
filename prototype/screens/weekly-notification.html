<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#06070A" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/app-icon-1024.svg" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <script src="../frame.js"></script>
  <title>NutriHero — Notificação</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../components.css" />
  <style>
    .home-bg {
      min-height: 100dvh;
      padding: var(--s-4);
      display: flex;
      flex-direction: column;
      gap: var(--s-4);
      opacity: 0.6;
      pointer-events: none;
      filter: blur(0.5px);
    }
    .home-bg .eyebrow { color: var(--c-cinza-400); }
    .home-bg .hero { font-family: var(--f-mono); font-weight: 700; font-size: 84px; color: var(--c-giz-200); line-height: 0.86; }
    .home-bg .target { font-family: var(--f-mono); font-size: 22px; color: var(--c-cinza-400); margin-left: var(--s-3); }
    .home-bg .pulso-line { width: 75%; opacity: 0.4; }
    .home-bg .meta-row { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 13px; color: var(--c-cinza-400); padding: var(--s-2) 0; }
    .home-bg .meta-row .l { font-family: var(--f-narrow); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }

    .status-bar {
      display: flex;
      justify-content: space-between;
      padding: var(--s-2) var(--s-4);
      font-family: var(--f-display);
      font-weight: 600;
      font-size: 14px;
      color: var(--c-giz-100);
      background: rgba(6, 7, 10, 0.6);
      backdrop-filter: blur(8px);
    }

    .notif-wrap {
      position: fixed;
      top: 56px;
      left: var(--s-2);
      right: var(--s-2);
      z-index: 60;
      animation: drop-in var(--t-medium) var(--ease-pulso);
    }
    @keyframes drop-in { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .notif {
      background: rgba(43, 46, 58, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 14px;
      padding: var(--s-3) var(--s-4);
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: var(--s-3);
      align-items: start;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .notif .icon {
      width: 36px;
      height: 36px;
      background: var(--c-vazio);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notif .icon img { width: 22px; height: 22px; }
    .notif .body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .notif .app {
      font-family: var(--f-display);
      font-weight: 600;
      font-size: 13px;
      color: var(--c-giz-100);
    }
    .notif .app .arco { color: var(--c-arco); }
    .notif .title {
      font-family: var(--f-display);
      font-weight: 700;
      font-size: 14px;
      color: var(--c-giz-100);
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }
    .notif .preview {
      font-family: var(--f-display);
      font-weight: 400;
      font-size: 13px;
      color: var(--c-giz-200);
      line-height: 1.3;
    }
    .notif .time {
      font-family: var(--f-display);
      font-weight: 500;
      font-size: 11px;
      color: var(--c-cinza-300);
    }
    .notif-tap {
      display: block;
      margin-top: var(--s-3);
      text-align: center;
      font-family: var(--f-narrow);
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--c-cinza-300);
    }
  </style>
</head>
<body>
  <div class="status-bar">
    <span>9:00</span>
    <span style="font-family: var(--f-mono); font-size: 12px;">●●●</span>
  </div>

  <div class="home-bg">
    <span class="eyebrow">CONSUMIDO · META 2.000 KCAL</span>
    <div style="display: flex; align-items: baseline;">
      <span class="hero">0</span>
      <span class="target">/ 2.000</span>
    </div>
    <div class="pulso-line"></div>
    <div class="meta-row"><span class="l">Restam</span><span>2.000 KCAL</span></div>
    <div class="meta-row"><span class="l">Próximo</span><span>Café · 07:15</span></div>
  </div>

  <div class="notif-wrap">
    <a href="weekly-dedicated.html" style="text-decoration: none;">
      <div class="notif">
        <div class="icon"><img src="../assets/mark-primary.svg" alt="" /></div>
        <div class="body">
          <span class="app">NutriHero<span class="arco">.</span></span>
          <span class="title">Sexta é tarde.</span>
          <span class="preview">Padrão de 3 semanas detectado. Toque para ver o reajuste sugerido.</span>
        </div>
        <span class="time">agora</span>
      </div>
    </a>
    <span class="notif-tap">Toque na notificação para abrir o diagnóstico</span>
  </div>

  <script src="../state.js"></script>
  <script src="../switcher.js"></script>
</body>
</html>
